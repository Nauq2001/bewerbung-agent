[project]
name = "bewerbung-agent-backend"
version = "0.1.0"
description = "Multi-agent job application assistant - backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
    "anthropic>=0.40",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# The vendor SDK and the plugin directory are the two places where a strict
# signature cannot be guaranteed: one is third-party, the other is not in the
# repository at all.
[[tool.mypy.overrides]]
module = ["anthropic.*", "app.sources.personal.*"]
ignore_missing_imports = true
